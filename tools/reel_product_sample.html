<title>reel burberry01</title>
<style>
@font-face{font-family:'MinchoB';src:url('../fonts/mincho-800.woff2') format('woff2');font-weight:800;font-display:block}
@font-face{font-family:'MinchoB';src:url('../fonts/mincho-700.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'NotoJP';src:url('../fonts/noto-400.woff2') format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'NotoJP';src:url('../fonts/noto-500.woff2') format('woff2');font-weight:500;font-display:block}
@font-face{font-family:'Cormo';src:url('../fonts/cormorant-600.woff2') format('woff2');font-weight:600;font-style:normal;font-display:block}
@font-face{font-family:'Cormo';src:url('../fonts/cormorant-500i.woff2') format('woff2');font-weight:500;font-style:italic;font-display:block}
:root{--ink:#0B0B0D;--ivory:#F7F3EC;--muted:#C4BCA9;--gold:#D2AC62;--goldsoft:#8A7442;color-scheme:dark}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
.stage{position:relative;width:1080px;height:1920px;background:radial-gradient(120% 78% at 50% 14%,#191921,#0A0A0D 76%);overflow:hidden}
.gframe{position:absolute;inset:46px;border:2px solid rgba(210,172,98,.30);border-radius:26px;pointer-events:none}
.gcorner{position:absolute;width:54px;height:54px;border:3px solid var(--gold);opacity:.85}
.k1{top:70px;left:70px;border-right:0;border-bottom:0}.k2{top:70px;right:70px;border-left:0;border-bottom:0}
.k3{bottom:70px;left:70px;border-right:0;border-top:0}.k4{bottom:70px;right:70px;border-left:0;border-top:0}
.sweep{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);top:0;opacity:.4;animation:sweep 4.4s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(430px)}50%{transform:translateY(1490px)}}
.badge{position:absolute;top:150px;left:0;right:0;text-align:center;font-family:'NotoJP';font-weight:500;color:var(--muted);font-size:32px;letter-spacing:.5em;text-transform:uppercase;z-index:5}
.fr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:250px 90px;opacity:0;transform:scale(.985);transition:opacity .5s ease,transform .6s ease}
.fr.on{opacity:1;transform:scale(1)}
.eyebrow{font-family:'Cormo',serif;font-style:italic;color:var(--gold);font-size:56px;letter-spacing:.05em;margin-bottom:34px}
.card{width:770px;height:770px;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 40px 90px -40px rgba(0,0,0,.95),0 0 0 1px rgba(210,172,98,.25);flex:0 0 auto}
.card img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 8s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.13) translate(-2%,-2%)}}
.cap{font-family:'MinchoB',serif;font-weight:800;color:var(--ivory);font-size:76px;line-height:1.4;letter-spacing:.03em;margin-top:44px;text-wrap:balance;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.cap.sm{font-size:60px}
.big{font-family:'MinchoB',serif;font-weight:800;color:var(--ivory);font-size:96px;line-height:1.4;letter-spacing:.03em;text-wrap:balance}
.small{font-family:'NotoJP';color:var(--muted);font-size:44px;margin-top:40px;line-height:1.65}
.small b{color:var(--gold);font-weight:700}
.progress{position:absolute;left:70px;right:70px;bottom:120px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;z-index:5}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--goldsoft),var(--gold))}
</style>
<div class="stage" id="stage">
  <div class="sweep"></div>
  <div class="gframe"></div><span class="gcorner k1"></span><span class="gcorner k2"></span><span class="gcorner k3"></span><span class="gcorner k4"></span>
  <div class="badge">meihin.note ・ NEW ARRIVAL</div>

  <div class="fr"><div class="eyebrow">New Arrival</div><div class="card"><img src="assets/b1.jpg"></div><div class="cap">この秋の、主役。</div></div>
  <div class="fr"><div class="eyebrow">Burberry</div><div class="card"><img src="assets/b2.jpg"></div><div class="cap sm">ヴィンテージチェック<br>クロスボディ</div></div>
  <div class="fr"><div class="eyebrow">Detail</div><div class="card"><img src="assets/b3.jpg"></div><div class="cap">上質なレザートリム。</div></div>
  <div class="fr"><div class="eyebrow">Style</div><div class="card"><img src="assets/b4.jpg"></div><div class="cap">斜めがけで、軽やかに。</div></div>
  <div class="fr"><div class="eyebrow">Where to buy</div><div class="big">気になる方は、<br>こちら。</div>
    <div class="small">プロフィールのリンク <b>@meihin.note</b><br>BUYMAで「<b>luxmall1004</b>」を検索</div></div>

  <div class="progress"><i id="bar"></i></div>
</div>
<script>
(function(){
  var frames=document.querySelectorAll('.fr'),bar=document.getElementById('bar'),step=-1,HOLD=1750,total=frames.length*HOLD;
  function show(i){frames.forEach(function(f,j){f.classList.toggle('on',j===i);});}
  window.__done=false;window.__total=total;
  window.startReel=function(){var start=0;requestAnimationFrame(function r(ts){if(!start)start=ts;var el=ts-start;bar.style.width=Math.min(100,el/total*100)+'%';var idx=Math.floor(el/HOLD);if(idx>=frames.length)idx=frames.length-1;if(idx!==step){step=idx;show(step);}if(el<total+250){requestAnimationFrame(r);}else{window.__done=true;}});};
})();
</script>
